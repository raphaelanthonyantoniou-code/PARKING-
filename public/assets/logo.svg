<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 12 114 68" role="img" aria-label="Parkareto">
  <defs>
    <linearGradient id="pk-front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a606c"/><stop offset=".35" stop-color="#1b1e25"/><stop offset=".7" stop-color="#0a0b0f"/><stop offset="1" stop-color="#2c3038"/></linearGradient>
    <linearGradient id="pk-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c0d11"/><stop offset=".6" stop-color="#262a32"/><stop offset="1" stop-color="#4a4f5a"/></linearGradient>
    <linearGradient id="pk-roof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a909c"/><stop offset=".5" stop-color="#2a2e36"/><stop offset="1" stop-color="#555b66"/></linearGradient>
    <linearGradient id="pk-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3550"/><stop offset=".6" stop-color="#0d0c14"/><stop offset="1" stop-color="#1e1b2a"/></linearGradient>
    <linearGradient id="pk-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9aa1ad"/><stop offset="1" stop-color="#e8ebf0"/></linearGradient>
    <pattern id="pk-stripe" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#f6c21a"/><rect width="4.5" height="9" fill="#0b0c10"/></pattern>
  </defs>
  <!-- barrier arm -->
  <g transform="rotate(-17 58 60)">
    <rect x="4" y="55" width="58" height="9" rx="1.5" fill="url(#pk-stripe)"/>
    <rect x="4" y="55" width="58" height="9" rx="1.5" fill="none" stroke="#0b0c10" stroke-width="1"/>
    <rect x="4" y="55.6" width="58" height="1.6" fill="#fff" opacity=".35"/>
  </g>
  <!-- barrier post -->
  <path d="M50 74h22l4 4H46z" fill="url(#pk-side)" stroke="url(#pk-edge)" stroke-width=".8"/>
  <rect x="52" y="49" width="16" height="26" rx="2" fill="url(#pk-front)" stroke="url(#pk-edge)" stroke-width=".9"/>
  <circle cx="60" cy="56" r="3.2" fill="#15171c" stroke="url(#pk-edge)" stroke-width="1"/>
  <circle cx="60" cy="56" r="1.1" fill="#cfd3da"/>
  <!-- booth: side face -->
  <path d="M100 27l10-5v46l-10 6z" fill="url(#pk-side)" stroke="url(#pk-edge)" stroke-width=".9"/>
  <!-- booth: front face -->
  <rect x="66" y="27" width="34" height="47" rx="2" fill="url(#pk-front)" stroke="url(#pk-edge)" stroke-width="1"/>
  <!-- windows -->
  <rect x="69" y="31" width="13" height="18" rx="1" fill="url(#pk-glass)" stroke="#c9ced6" stroke-width=".6"/>
  <rect x="84" y="31" width="13" height="18" rx="1" fill="url(#pk-glass)" stroke="#c9ced6" stroke-width=".6"/>
  <path d="M70 33l6 0-5 9h-1z" fill="#fff" opacity=".18"/>
  <path d="M101.5 32l7-3.5v16l-7 3.5z" fill="url(#pk-glass)" stroke="#c9ced6" stroke-width=".5"/>
  <!-- door and vents -->
  <rect x="88" y="52" width="9" height="20" rx="1" fill="none" stroke="#9aa1ad" stroke-width=".6"/>
  <g stroke="#9aa1ad" stroke-width=".6"><path d="M70 58h9M70 60.5h9M70 63h9"/><path d="M90 24h6M90 25.6h6"/></g>
  <path d="M66 51h34" stroke="#c9ced6" stroke-width=".6"/>
  <!-- roof slab -->
  <path d="M62 22h40l12-6H74z" fill="url(#pk-roof)" stroke="url(#pk-edge)" stroke-width=".9"/>
  <path d="M62 22h40v6H62z" fill="url(#pk-front)" stroke="url(#pk-edge)" stroke-width=".9"/>
  <path d="M102 22l12-6v6l-12 6z" fill="url(#pk-side)" stroke="url(#pk-edge)" stroke-width=".9"/>
  <path d="M70 20h28l6-3H76z" fill="#0b0c10" opacity=".55"/>
  <!-- base -->
  <path d="M64 74h38l8-5v3l-8 5H64z" fill="#0b0c10" stroke="url(#pk-edge)" stroke-width=".7"/>
</svg>
